services:
  gitphoto:
    build: .
    image: gitphoto:latest
    container_name: gitphoto
    restart: unless-stopped
    ports:
      - "${PORT:-9780}:9780"
    env_file:
      - .env
    environment:
      # Inside the container the data volume is a Linux path, never the host's.
      DATA_DIR: /data
      PORT: "9780"
    volumes:
      - gitphoto-data:/data
    # Chromium crashes with "session deleted" when /dev/shm is left at 64 MB,
    # which is the Docker default.
    shm_size: 1gb
    # A shallow clone plus a browser launch is heavier than the compose default.
    mem_limit: 2g
    healthcheck:
      # Readiness, not liveness: Chromium has to launch before the first render
      # can succeed, so a container that only proves the port is open sends its
      # first customer into a browser launch timeout.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9780/api/ready"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

volumes:
  gitphoto-data:
